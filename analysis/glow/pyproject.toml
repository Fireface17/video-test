[project]
name = "glow-analysis"
version = "0.1.0"
description = "Timing data for the Glowing In The Dark video (Linux/CPU: ONNX models from GitHub releases)"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "librosa>=0.10",
    "soundfile>=0.12",
    "onnxruntime>=1.17",
    "sherpa-onnx>=1.10",
    "sherpa-onnx-core>=1.10",
    "kaldi-native-fbank>=1.20",
    "matplotlib>=3.8",
]
